- title: Experience
  type: time_table
  contents:
    - title: Pre-doctoral Researcher
      institution: Google DeepMind
      year: 2025 - 2026
      description:
        - title: ProEval: Proactive Failure Discovery and Efficient Performance Estimation for AI Evaluation (Dr. Zi Wang)
          contents:
            - Developed an active evaluation framework that estimates model performance and discovers failures using Bayesian inference.
            - Improved sample efficiency through transfer-learned Gaussian Process surrogates that eliminate cold-start evaluation.
            - Reduced evaluation cost by 65× while uncovering 5× more diverse failures across 16 LLMs/VLMs.
        - title: Steering for Multilingual Fact Recall in Vision-Language Models (Dr. Laura Rimell)
          contents:
            - Developed mechanistic analyses for VLMs using activation patching to identify the circuits responsible for cross-lingual failures.
            - Discovered that multilingual performance gaps arise from late-layer query-key attention routing, not missing factual knowledge.
            - Showed that text-derived steering vectors transfer across modalities, recovering up to 17% multilingual accuracy.
        - title: Improving Cultural Awareness in Gemini (Shachi Dave, Dr. Partha Talukdar, Dr. Bidisha Samanta)
          contents:
            - Improved cultural alignment across 6 locales by developing a reference-guided critique reward signal for RLHF fine-tuning.
            - Designed an agentic, information-theoretic evaluation framework that adaptively maximises expected information gain to characterise foundation models' knowledge boundaries.
    - title: Research Assistant
      institution: Social AI Studio, Singapore University of Technology and Design (SUTD)
      year: 2024 - 2025
      description:
        - title: SEAHateCheck: Functional Tests for Detecting Hate Speech in Low-Resource Languages (Dr. Roy Ka-Wei Lee)
          contents:
            - Built the first functional hate speech detection benchmark for 8 Southeast Asian languages, covering 19 functional tests.
            - Engineered a LoRA fine-tuning+evaluation pipeline for 12 LLMs using PEFT to systematically benchmark the suite.
            - Quantified sociolinguistic gaps across Age, Disability, and Gender, exposing systematic LLM failures on protected categories.
        - title: MATK: The Meme Analytical Toolkit (Dr. Roy Ka-Wei Lee)
          contents:
            - Built a plug-and-play framework for hateful meme classification, unifying 8 datasets and 7 models behind a single training interface.
            - Built YAML-driven experiment orchestration for meme classification, eliminating code changes when swapping datasets or models.
            - Leveraged Integrated Gradients to diagnose VLM biases, revealing over-reliance on text features over multimodal reasoning.
